# /docker-compose.yml
version: '3.8'

services:
  api-service:
    build:
      context: .
      dockerfile: backend/api-service/Dockerfile
    restart: always
    stop_grace_period: 15s
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      JWT_SECRET: ${JWT_SECRET}
      PORT: 8000
      NODE_ENV: production
      SHARED_SPACES_ENABLED: ${SHARED_SPACES_ENABLED:-false}
      LIVE_SESSIONS_ENABLED: ${LIVE_SESSIONS_ENABLED:-false}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-}
      # Internal URL for PDF image resolution (Puppeteer runs in same container)
      INTERNAL_API_URL: http://localhost:8000
      # SMTP Production Settings
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      FRONTEND_URL: ${FRONTEND_URL}
    volumes:
      - api-data:/app/backend/api-service/data # Persist SQLite DBs
      - uploads-data:/app/backend/api-service/uploads # Persist uploaded files
    ports:
      - "127.0.0.1:8000:8000"


volumes:
  api-data:
  uploads-data:
