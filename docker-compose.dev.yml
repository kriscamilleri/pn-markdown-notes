# /docker-compose.dev.yml
version: '3.8'

services:
  # The unified backend service for auth, sync, and images
  api-service:
    build:
      context: .
      dockerfile: backend/api-service/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
      - "127.0.0.1:9229:9229" # Node.js debugger
    command: node --inspect=0.0.0.0:9229 index.js
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      JWT_SECRET: ${JWT_SECRET:-super-secret-for-dev}
      PORT: 8000
      NODE_ENV: development
      SHARED_SPACES_ENABLED: ${SHARED_SPACES_ENABLED:-false}
      LIVE_SESSIONS_ENABLED: ${LIVE_SESSIONS_ENABLED:-false}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL:-http://localhost:8000}
      # Internal URL for PDF image resolution (Puppeteer runs in same container)
      INTERNAL_API_URL: http://localhost:8000
      # Email settings (e.g., for MailHog or other test SMTP)
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-"Panino Dev <noreply@panino.dev>"}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    volumes:
      - ./backend/api-service:/app/backend/api-service
      - ./shared:/app/shared:ro
      - ./backend/api-service/data:/app/backend/api-service/data # Persist SQLite DBs
      - ./backend/api-service/uploads:/app/backend/api-service/uploads # Persist uploaded files
      - /app/backend/api-service/node_modules

  # Add MailHog for local email testing
  mailhog:
    image: mailhog/mailhog
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # Web UI

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile.dev
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      NODE_ENV: development
      VITE_API_SERVICE_URL: http://localhost:8000 # Unified API URL
      VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY}
    volumes:
      - ./frontend:/app
      - ./shared:/shared:ro
      - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      - api-service
      - mailhog
