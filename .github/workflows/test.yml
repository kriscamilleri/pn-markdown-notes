name: Tests

on:
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'LICENSE'
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'LICENSE'
  workflow_call:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # actions/checkout initializes a fresh repository before it fetches. Explicitly setting
  # the repository's default branch avoids Git's global default-branch advisory.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: |
            shared/package-lock.json
            frontend/package-lock.json
      # The frontend file: link resolves bare imports from the shared package
      # directory. Match the Docker build order so its runtime dependency is
      # present in a clean checkout before Vitest loads contentMerge.js.
      - run: npm ci --omit=dev
        working-directory: shared
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run backend suite in the Node 24 test image
        run: ./scripts/test-backend.sh
